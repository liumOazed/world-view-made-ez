name: Probe index sources (temporary)
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe-sources.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe-sources.mjs
