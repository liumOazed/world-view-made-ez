name: Probe regional sources (temporary)
on:
  push:
    branches: ['claude/**']
    paths: ['scripts/probe-sources.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-sources.mjs
