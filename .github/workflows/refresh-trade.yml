name: Refresh trade data

# Pulls each country's top trade partners from UN Comtrade into
# src/data/trade.json. The free API only covers ~30 countries an hour, so
# each daily run fills in missing countries, then ones older than 30 days.
# On main, runs build up one PR on the data/trade-refresh branch.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      countries:
        description: ISO alpha-3 codes to refresh (blank = all)
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-trade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Continue from the open refresh PR, if any
        if: github.ref_name == 'main'
        run: |
          if git fetch origin data/trade-refresh 2>/dev/null; then
            git checkout FETCH_HEAD -- src/data/trade.json
          fi
      # Comtrade's free API is slow; keep whatever is fetched in 50 minutes.
      - run: node scripts/fetch-trade.mjs ${{ inputs.countries }}
        timeout-minutes: 50
        continue-on-error: true
      - run: npm run build
      - name: Commit the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/trade.json
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Refresh trade data from UN Comtrade ($(date -u +%Y-%m-%d))"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            # A bot-only branch: main plus one data commit, replaced each run.
            git push --force origin HEAD:refs/heads/data/trade-refresh
            gh pr create --head data/trade-refresh --base main --title 'Refresh trade data from UN Comtrade' \
              --body 'Automated refresh of `src/data/trade.json`. Each daily run adds more countries until all are covered; merge whenever.' \
              || echo 'PR already open, or Actions may not open PRs here; the branch is pushed.'
          else
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
